name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Analyze
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./PSLedger -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize -Property Severity, RuleName, ScriptName, Line, Message | Out-String -Width 250
          if ($results) { throw "PSScriptAnalyzer found $(@($results).Count) issue(s)." }

  test:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          Install-Module Pester -MinimumVersion 6.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module TDDUtils -Scope CurrentUser -Force
          # TDDUtils 1.0.5 dot-sources a private file without its .ps1 extension,
          # which only resolves on Windows. Patch it until a fixed version is published.
          $psm1 = Join-Path (Get-Module TDDUtils -ListAvailable | Select-Object -First 1).ModuleBase 'TDDUtils.psm1'
          (Get-Content $psm1) -replace 'Get-TDDParamBlockAttribute$', 'Get-TDDParamBlockAttribute.ps1' | Set-Content $psm1

      - name: Run tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 6.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.os }}
          path: pester-results.xml
