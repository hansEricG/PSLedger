name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Analyze
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./PSLedger -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize -Property Severity, RuleName, ScriptName, Line, Message | Out-String -Width 250
          if ($results) { throw "PSScriptAnalyzer found $(@($results).Count) issue(s)." }

  test:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          Install-Module Pester -MinimumVersion 6.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module TDDUtils -MinimumVersion 1.0.6 -Scope CurrentUser -Force

      - name: Run tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 6.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.os }}
          path: pester-results.xml

  publish:
    name: Publish to PowerShell Gallery
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment: psgallery
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check version and extract release notes
        shell: pwsh
        run: |
          $version = (Import-PowerShellDataFile ./PSLedger/PSLedger.psd1).ModuleVersion
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match ModuleVersion $version in PSLedger.psd1."
          }
          $lines = Get-Content ./CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $version." }
          $end = ($lines[$start..($lines.Count - 1)] | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $notes = if ($end) { $lines[$start..($start + $end - 2)] } else { $lines[$start..($lines.Count - 1)] }
          $notes | Set-Content release-notes.md -Encoding utf8

      - name: Publish module
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'The PSGALLERY_API_KEY secret is not set.' }
          Publish-PSResource -Path ./PSLedger -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY -Verbose

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' --title '${{ github.ref_name }}' --notes-file release-notes.md --verify-tag
